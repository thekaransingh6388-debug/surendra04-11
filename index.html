  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0a0e17;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(0, 200, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(255, 215, 0, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 255, 150, 0.04) 0%, transparent 60%);
      z-index: -1;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(0, 200, 255, 0.3);
      border-radius: 50%;
      z-index: -1;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== MAIN CARD ===== */
    .landing-card {
      background: linear-gradient(145deg, #111827, #0d1321);
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 24px;
      padding: 40px 32px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 0 60px rgba(0, 200, 255, 0.08),
        0 0 120px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    /* Glowing top border */
    .landing-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00c8ff, #ffd700, #00c8ff, transparent);
      border-radius: 2px;
      animation: glowLine 3s ease-in-out infinite alternate;
    }

    @keyframes glowLine {
      0% { opacity: 0.5; }
      100% { opacity: 1; box-shadow: 0 0 20px rgba(0, 200, 255, 0.5); }
    }

    /* ===== LOGO ===== */
    .logo-container {
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(0, 200, 255, 0.4);
      box-shadow: 
        0 0 30px rgba(0, 200, 255, 0.3),
        0 0 60px rgba(0, 200, 255, 0.1);
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .logo-container img:hover {
      transform: scale(1.05);
    }

    /* Rotating glow ring around logo */
    .logo-container::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00c8ff, #ffd700, #00ff96, #00c8ff);
      animation: rotateRing 4s linear infinite;
      z-index: 0;
      opacity: 0.6;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== HEADINGS ===== */
    .name-title {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 0%, #00c8ff 50%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .tagline {
      font-size: 0.95rem;
      color: #8899b3;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* ===== DIVIDER ===== */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00c8ff, #ffd700, transparent);
      margin: 0 auto 28px;
      border-radius: 2px;
    }

    /* ===== DESCRIPTION ===== */
    .description {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #b0c0d8;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .description strong {
      color: #00c8ff;
      font-weight: 600;
    }

    /* ===== BUTTONS ===== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 28px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    /* Telegram Primary Button */
    .btn-telegram {
      background: linear-gradient(135deg, #0088cc, #00aaff, #00c8ff);
      color: #ffffff;
      box-shadow: 
        0 4px 20px rgba(0, 170, 255, 0.4),
        0 0 40px rgba(0, 200, 255, 0.15);
      animation: blinkTelegram 1.2s ease-in-out infinite;
    }

    @keyframes blinkTelegram {
      0%, 100% { 
        box-shadow: 0 4px 20px rgba(0, 170, 255, 0.4), 0 0 40px rgba(0, 200, 255, 0.15);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 4px 30px rgba(0, 200, 255, 0.8), 0 0 70px rgba(0, 200, 255, 0.4);
        transform: scale(1.02);
      }
    }

    .btn-telegram:hover {
      background: linear-gradient(135deg, #00aaff, #00c8ff, #00e0ff);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 35px rgba(0, 200, 255, 0.6);
    }

    /* Blink overlay effect for Telegram */
    .btn-telegram::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Second Button – Stock Analysis */
    .btn-stock {
      background: linear-gradient(135deg, #1a2332, #253245);
      color: #ffd700;
      border: 1.5px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
      animation: blinkStock 1.2s ease-in-out infinite;
    }

    @keyframes blinkStock {
      0%, 100% { 
        border-color: rgba(255, 215, 0, 0.4);
        box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
      }
      50% { 
        border-color: rgba(255, 215, 0, 0.9);
        box-shadow: 0 4px 30px rgba(255, 215, 0, 0.35);
      }
    }

    .btn-stock:hover {
      background: linear-gradient(135deg, #253245, #30425a);
      border-color: #ffd700;
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 215, 0, 0.3);
    }

    /* ===== POWERED BY ===== */
    .powered-by {
      font-size: 0.8rem;
      color: #5a6a80;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .powered-by strong {
      color: #00c8ff;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    /* ===== BADGE ===== */
    .badge {
      display: inline-block;
      background: rgba(0, 200, 255, 0.1);
      border: 1px solid rgba(0, 200, 255, 0.25);
      color: #00c8ff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 520px) {
      .landing-card {
        padding: 32px 22px 28px;
        border-radius: 20px;
      }

      .name-title {
        font-size: 1.5rem;
      }

      .logo-container img {
        width: 90px;
        height: 90px;
      }

      .description {
        font-size: 0.95rem;
      }

      .btn {
        padding: 14px 22px;
        font-size: 0.95rem;
      }

      .tagline {
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 380px) {
      .name-title {
        font-size: 1.3rem;
      }

      .description {
        font-size: 0.88rem;
      }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0e17;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a2a40;
      border-radius: 4px;
    }
  </style>
</head>
